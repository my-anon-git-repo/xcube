# NOTE: flash-attn is deliberately NOT listed below. setup.py merges
# `requirements` and `pip_requirements` into one install_requires list, so
# anything added here gets pulled into every `pip install -e .` run. flash-attn
# needs torch already importable at its own build time and typically needs
# `--no-build-isolation`, which install_requires can't express -- bundling it
# risks breaking `pip install -e .` on any machine without a matching CUDA
# build toolchain (e.g. this dev machine's Turing GPU has no flash-attn-2
# support at all). Only needed for Phi-3-small-8k-instruct on Ampere+/Hopper
# GPUs (see README_EURLEX_WIKI10.md); install separately there, after
# `pip install -e .`:
#   pip install flash-attn --no-build-isolation
#
# tiktoken and pytest ARE listed below (unlike flash-attn) -- both are plain
# pip installs with no torch/build-order dependency, so pip install -e . just
# works with them on any machine. Needed for Phi-3-small-8k-instruct's
# trust_remote_code path: tiktoken backs its custom tokenizer, and pytest is a
# stray top-level import in Microsoft's own modeling_phi3_small.py (not used
# for anything we actually test with -- just needs to be importable). See the
# trust_remote_code porting note in README_EURLEX_WIKI10.md.
